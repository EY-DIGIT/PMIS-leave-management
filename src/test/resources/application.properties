# Tests run against an in-memory H2 database (PostgreSQL compatibility mode)
# so no live Postgres is required to build.
spring.datasource.url=jdbc:h2:mem:leave_management;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

users-service.introspect-url=http://localhost:9999/users/api/v3/users/introspect
projects-service.base-url=http://localhost:9999/projects-service
