spring.application.name=leave-management

# --- PostgreSQL 16 datasource ---
# Override with environment variables in production.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
# 'update' auto-creates/updates the public_holiday table on startup.
spring.jpa.hibernate.ddl-auto=update
# Dialect is auto-detected from the live connection (reports the real PostgreSQL 16
# version). Setting it explicitly pins Hibernate to the dialect's default baseline
# (v12) and triggers the HHH90000025 deprecation warning, so we leave it unset.
spring.jpa.open-in-view=false
spring.jackson.serialization.write-dates-as-timestamps=false

# --- springdoc / Swagger UI ---
# Swagger UI:  http://localhost:8080/swagger-ui.html
# OpenAPI JSON: http://localhost:8080/v3/api-docs
springdoc.swagger-ui.path=/lms/docs
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
