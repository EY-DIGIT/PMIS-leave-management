spring.application.name=leave-management

# ============================================================
#  PostgreSQL datasource
# ============================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=postgres

#spring.datasource.url=${DATABASE_URL}
#spring.datasource.username=${DATABASE_USERNAME}
#spring.datasource.password=${DATABASE_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.default_schema=leave

# --- JPA / Hibernate ---
# 'update' auto-creates/updates the public_holiday table on startup.
spring.jpa.hibernate.ddl-auto=update
# Dialect is auto-detected from the live connection (reports the real PostgreSQL 16
# version). Setting it explicitly pins Hibernate to the dialect's default baseline
# (v12) and triggers the HHH90000025 deprecation warning, so we leave it unset.
spring.jpa.open-in-view=false
spring.jackson.serialization.write-dates-as-timestamps=false

# --- springdoc / Swagger UI ---
# Swagger UI:  http://localhost:8080/swagger-ui.html
# OpenAPI JSON: http://localhost:8080/v3/api-docs
springdoc.swagger-ui.path=/lms/docs
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# --- Users service (token introspection) ---
# Every /api/** request must carry a valid bearer token, checked against this endpoint.
users-service.introspect-url=http://10.1.131.199/users/api/v3/users/introspect
