spring.application.name=leave-management

# ============================================================
#  File storage (NFS mount for uploaded / exported Excel files)
# ============================================================
# NFS_SERVER=10.1.111.11  NFS_EXPORT_PATH=/srv/nfs/dev/pmis_leave_files
# Mount the NFS export at FILE_STORAGE_PATH before starting the service.
file.storage.path=/mnt/pmis_leave_files

# ============================================================
#  PostgreSQL datasource
# ============================================================
#
#spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/postgres}
#spring.datasource.username=${DATABASE_USERNAME:postgres}
#spring.datasource.password=${DATABASE_PASSWORD:postgres}

spring.datasource.url=jdbc:postgresql://10.1.131.199:5432/pmis_db
spring.datasource.username=pmis_user
spring.datasource.password=aadhaarpmis2026

spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.default_schema=leave

# --- JPA / Hibernate ---
# 'update' auto-creates/updates the public_holiday table on startup.
spring.jpa.hibernate.ddl-auto=update
# Dialect is auto-detected from the live connection (reports the real PostgreSQL 16
# version). Setting it explicitly pins Hibernate to the dialect's default baseline
# (v12) and triggers the HHH90000025 deprecation warning, so we leave it unset.
spring.jpa.open-in-view=false
spring.jackson.serialization.write-dates-as-timestamps=false

# --- springdoc / Swagger UI ---
# Swagger UI:  http://localhost:8080/swagger-ui.html
# OpenAPI JSON: http://localhost:8080/v3/api-docs
springdoc.swagger-ui.path=/lms/docs
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# --- CORS ---
# Comma-separated allowed origins for /api/**. "*" (default) allows any origin — fine for
# local/dev use, but set this to your real frontend origin(s) before a shared/production deploy.
cors.allowed-origins=*

# --- Users service (token introspection) ---
# Every /api/** request must carry a valid bearer token, checked against this endpoint.
auth.enabled=true
users-service.introspect-url=http://10.1.131.199/users/api/v3/users/introspect

# --- Leave policy (projects service) ---
# GET {projects-service.base-url}/api/v3/projects/{projectId} — the leaveConfig block of the
# response is a project's real leave policy (fetched per resource's project on attendance
# upload). The caller's bearer token is forwarded, since this endpoint requires one. Set
# leave-policy-service.mock=true to use a hardcoded sample policy instead (e.g. offline dev).
leave-policy-service.mock=false
projects-service.base-url=http://10.1.131.199/projects
